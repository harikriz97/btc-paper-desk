<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC Paper Desk</title>
<meta name="description" content="30-day paper forward test of BTC option-selling strategies on Delta Exchange India">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#070a12;--bg2:#0c111d;--card:rgba(20,27,43,.72);--card2:#141b2b;--line:rgba(148,163,184,.14);--ink:#eef2f8;--ink2:#a7b0c2;--mut:#6b768c;
--pos:#22c55e;--neg:#f43f5e;--acc:#6366f1;--acc2:#22d3ee;--warn:#f59e0b;--posbg:rgba(34,197,94,.13);--negbg:rgba(244,63,94,.13);--accbg:rgba(99,102,241,.16);
--glow:0 0 0 1px rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.6)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fb;--bg2:#e9edf6;--card:rgba(255,255,255,.85);--card2:#fff;--line:rgba(15,23,42,.09);--ink:#0f172a;--ink2:#475569;--mut:#94a3b8;
--pos:#16a34a;--neg:#e11d48;--acc:#4f46e5;--acc2:#0891b2;--posbg:rgba(22,163,74,.1);--negbg:rgba(225,29,72,.09);--accbg:rgba(79,70,229,.1);--glow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -14px rgba(15,23,42,.25)}}
:root[data-theme="light"]{--bg:#f3f5fb;--bg2:#e9edf6;--card:rgba(255,255,255,.85);--card2:#fff;--line:rgba(15,23,42,.09);--ink:#0f172a;--ink2:#475569;--mut:#94a3b8;
--pos:#16a34a;--neg:#e11d48;--acc:#4f46e5;--acc2:#0891b2;--posbg:rgba(22,163,74,.1);--negbg:rgba(225,29,72,.09);--accbg:rgba(79,70,229,.1);--glow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -14px rgba(15,23,42,.25)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,rgba(99,102,241,.18),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(34,211,238,.10),transparent 55%),var(--bg);
background-attachment:fixed;color:var(--ink);font:14px/1.5 Inter,system-ui,Segoe UI,Arial,sans-serif;min-height:100vh}
.num,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
a{color:var(--acc2)}
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.hwrap{max-width:1440px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.2px;font-size:16px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal;color:#fff;font-size:15px;box-shadow:0 6px 18px -6px var(--acc)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--ink2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}.dot.on{background:var(--pos);box-shadow:0 0 0 4px var(--posbg);animation:pulse 2s infinite}.dot.off{background:var(--neg);box-shadow:0 0 0 4px var(--negbg)}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.px{font-size:19px;font-weight:700;color:var(--ink)}.sp{flex:1}
.prog{display:flex;align-items:center;gap:10px;min-width:180px}.bar{flex:1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.tbtn{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:9px;padding:6px 9px;cursor:pointer;font:inherit}
nav{max-width:1440px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--ink2);padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--acc2)}
main{max-width:1440px;margin:0 auto;padding:20px 20px 60px}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.c21{grid-template-columns:2fr 1fr}
@media(max-width:1100px){.c3{grid-template-columns:1fr 1fr}.c21{grid-template-columns:1fr}}@media(max-width:760px){.c2,.c3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--glow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0;flex-wrap:wrap}.ch h3{margin:0;font-size:14px;font-weight:700}.ch .sub{font-size:12px}
.cb{padding:12px 16px 16px}.sub{color:var(--mut);font-size:12px}.mut{color:var(--mut)}.pos{color:var(--pos)}.neg{color:var(--neg)}
.kpi{padding:16px}.kpi .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;font-weight:600}.kpi .v{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.kpi.hero{background:linear-gradient(135deg,rgba(99,102,241,.22),rgba(34,211,238,.08)),var(--card)}
.chart{position:relative;height:280px}.chart.sm{height:220px}.chart.xs{height:180px}
table{width:100%;border-collapse:collapse}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);font-weight:700;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}tr:last-child td{border-bottom:0}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}tbody tr:hover{background:rgba(148,163,184,.06)}.scroll{overflow-x:auto}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(148,163,184,.12);color:var(--ink2)}
.chip.p{background:var(--posbg);color:var(--pos)}.chip.n{background:var(--negbg);color:var(--neg)}.chip.a{background:var(--accbg);color:var(--acc2)}
.heat{display:grid;grid-template-columns:130px repeat(30,minmax(13px,1fr));gap:4px;align-items:center;font-size:11px;min-width:600px}
.heat .c{height:24px;border-radius:6px;background:rgba(148,163,184,.08)}.heat .h{color:var(--mut);text-align:center;font-size:10px}
.zone{position:relative;height:46px;margin:6px 46px 0}.zone .tr{position:absolute;top:18px;left:0;right:0;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--negbg),transparent 30%,transparent 70%,var(--negbg))}
.zone .ok{position:absolute;top:14px;height:14px;border-radius:9px;background:var(--posbg);border:1px solid var(--pos)}
.zone .me{position:absolute;top:11px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--acc2);border:4px solid var(--card2);box-shadow:0 0 0 2px var(--acc2)}
.zone .lb{position:absolute;top:-6px;transform:translateX(-50%);font-size:11px;color:var(--mut);white-space:nowrap}.zone .lb.me2{top:34px;color:var(--acc2);font-weight:700}
.leg{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.big{font-size:24px;font-weight:800;letter-spacing:-.4px}.help{font-size:13.5px;line-height:1.7;color:var(--ink2)}.help b{color:var(--ink)}
.stc{display:flex;flex-direction:column;gap:10px}.stc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini div{background:rgba(148,163,184,.07);border-radius:10px;padding:8px 10px}.mini .l{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}.mini .v{font-weight:700;margin-top:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.gal a{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}.gal img{width:100%;display:block}.gal .cap{padding:8px 10px;font-size:12px;display:flex;justify-content:space-between}
.ev{display:grid;grid-template-columns:160px 54px 76px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}.ev pre{margin:0;white-space:pre-wrap;font:12px "JetBrains Mono",monospace;color:var(--ink2)}
.filters{display:flex;gap:6px;flex-wrap:wrap}.filters button{background:rgba(148,163,184,.08);border:1px solid var(--line);color:var(--ink2);padding:5px 11px;border-radius:9px;cursor:pointer;font:inherit;font-size:12px;font-weight:600}.filters button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.empty{padding:34px;text-align:center;color:var(--mut)}.sec{margin-top:16px}
footer{max-width:1440px;margin:0 auto;padding:0 20px 30px;color:var(--mut);font-size:12px}
@media(max-width:640px){.hwrap,nav,main,footer{padding-left:14px;padding-right:14px}.kpi .v{font-size:22px}.ev{grid-template-columns:1fr}.zone{margin:6px 30px 0}.prog{min-width:120px}.chart{height:240px}}
</style>
</head>
<body>
<header>
 <div class="hwrap">
  <div class="logo"><i>₿</i>BTC Paper Desk</div>
  <span class="px num" id="spot">–</span>
  <span class="pill"><span class="dot" id="edot"></span><span id="etxt">loading</span></span>
  <span class="pill" id="upd">–</span>
  <span class="pill" style="color:var(--acc2)">PAPER · no real money</span>
  <span class="sp"></span>
  <div class="prog"><span class="sub" id="dlab">Day –</span><div class="bar"><i id="dbar"></i></div></div>
  <button class="tbtn" id="theme" title="Toggle theme">◐</button>
 </div>
 <nav id="tabs"></nav>
</header>
<main>
 <section id="v-live"></section><section id="v-overview" hidden></section><section id="v-strategies" hidden></section>
 <section id="v-trades" hidden></section><section id="v-costs" hidden></section><section id="v-research" hidden></section><section id="v-events" hidden></section>
</main>
<footer>Paper trading only · fills at live Delta Exchange India bid/ask · fees + 18% GST · each strategy = own ₹20,000 paper account, max loss ₹1,000/day · not financial advice</footer>
<script>
const C=['#6366f1','#f97316','#14b8a6','#eab308','#ec4899','#a78bfa','#22c55e','#06b6d4','#f43f5e'];
let S=null,R=null,tab='live',charts={},tsel='ALL',eqMode='rs';
try{tab=localStorage.getItem('tab2')||'live';const th=localStorage.getItem('theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const $=id=>document.getElementById(id);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fx=(v,d=1)=>v==null||isNaN(v)?'–':Number(v).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=v=>v==null?'':(v>0?'pos':v<0?'neg':'');
const pc=v=>v==null?'–':(v*100).toFixed(1)+'%';
const sgn=(v,d=1)=>v==null?'–':(v>0?'+':'')+fx(v,d);
const toR=(v,l)=>v*S.cv*l*S.fx;
const R1=v=>{if(v==null)return'–';const a=Math.abs(v);return(v<0?'-₹':v>0?'+₹':'₹')+(a<100?a.toFixed(1):fx(a,0))};
const rs=(v,l)=>v==null?'–':R1(toR(v,l));
const TABS=[['live','Live'],['overview','Overview'],['strategies','Strategies'],['trades','Trades'],['costs','Costs'],['research','Research'],['events','Events']];
function base(o={}){const g=css('--line'),k=css('--ink2');return{animation:false,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
 plugins:{legend:{labels:{color:k,boxWidth:10,boxHeight:10,usePointStyle:true,font:{size:11}}},tooltip:{backgroundColor:'rgba(15,23,42,.95)',padding:10,cornerRadius:8}},
 scales:{x:{ticks:{color:k,maxTicksLimit:8,font:{size:11}},grid:{display:false},border:{display:false}},y:{ticks:{color:k,font:{size:11}},grid:{color:g},border:{display:false}}},...o}}
function mk(id,cfg){if(charts[id])charts[id].destroy();const el=$(id);if(el)charts[id]=new Chart(el,cfg)}
function card(title,sub,body,extra=''){return`<div class="card ${extra}"><div class="ch"><h3>${title}</h3><span class="sub">${sub||''}</span></div><div class="cb">${body}</div></div>`}
const STRS=()=>S.strategies.map((x,i)=>({...x,i}));
function tabsBar(){$('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}${k==='live'&&S?` <span class="chip a">${S.strategies.filter(x=>x.open).length}</span>`:''}</button>`).join('');
 TABS.forEach(([k])=>$('v-'+k).hidden=k!==tab)}
function go(k){tab=k;try{localStorage.setItem('tab2',k)}catch(e){};draw()}
$('theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');const nx=cur==='light'?'dark':'light';
 document.documentElement.dataset.theme=nx;try{localStorage.setItem('theme',nx)}catch(e){};draw()};
function head(){$('spot').textContent='BTC '+fx(S.spot,0);const age=S.generated_at?Math.max(0,Date.now()/1000-S.generated_at):0;
 const ok=S.engine_ok&&age<900;$('edot').className='dot '+(ok?'on':'off');$('etxt').textContent=ok?'engine live':'engine offline';
 $('upd').textContent=age<90?'updated just now':`updated ${Math.round(age/60)} min ago`;
 $('dlab').textContent=S.day<1?`Starts ${S.start}`:`Day ${S.day} / ${S.days}`;$('dbar').style.width=Math.min(100,Math.max(0,S.day/S.days*100))+'%'}
/* ------------------------------------------------------------ LIVE */
async function live(){const el=$('v-live');const T=STRS();const opens=T.filter(x=>x.open);
 const stc={OPEN:'a',DONE:'p',SKIPPED:'n',WAITING:''},stTxt={OPEN:'Trade odudhu',DONE:'Mudinjiduchu',SKIPPED:'Inniku illa',WAITING:'Wait'};
 const why=n=>!n?'':n.startsWith('engine offline')?'Entry neram-la engine off':n.startsWith('premium')?'Premium kammi - filter skip':n.startsWith('entry at')?'Entry '+n.split('at ')[1]:n.startsWith('next entry')?'Naalai '+n.split('tomorrow ')[1]:n.startsWith('since')?n.replace('since','')+' mudhal':n;
 const tot=T.reduce((a,x)=>a+toR(x.total,x.lots),0),td=T.reduce((a,x)=>a+toR(x.today,x.lots),0),om=opens.reduce((a,x)=>a+toR(x.open.eq_mark,x.lots),0);
 el.innerHTML=`<div class="grid k4">
 <div class="card kpi hero"><div class="l">Inniku (closed + open)</div><div class="v num ${sg(td+om)}">${R1(td+om)}</div><div class="s">${opens.length} trade${opens.length===1?'':'s'} open ippo</div></div>
 <div class="card kpi"><div class="l">Open trades MTM</div><div class="v num ${sg(om)}">${R1(om)}</div><div class="s">ippove close pannaa approx</div></div>
 <div class="card kpi"><div class="l">Total paper P&L</div><div class="v num ${sg(tot)}">${R1(tot)}</div><div class="s">${T.length} accounts × ₹${fx(S.capital,0)}</div></div>
 <div class="card kpi"><div class="l">BTC</div><div class="v num">${fx(S.spot,0)}</div><div class="s">${S.now} IST</div></div></div>
 <div class="card sec"><div class="cb help"><b>Epdi padikkanum:</b> naama options <b>vikkirom</b>. Vitha option vilai <b>kuraindhaa laabam</b>, <b>eriduchu na nashtam</b>.
 BTC <b style="color:var(--pos)">safe zone</b>-kulla irundha expiry-la laabam; thaandina nashtam aaga aarambikkum. Ovvoru strategy-kum ₹20,000 account, max ₹1,000/naal nashtam.</div></div>
 <div class="sec">${card(`Inniku plan · ${S.today}`,'ovvoru strategy-um ippo enna pannudhu',`<div class="scroll"><table><thead><tr><th>Neram</th><th>Strategy</th><th>Nilamai</th><th>Vivaram</th><th>₹</th></tr></thead><tbody>
 ${[...T].sort((a,b)=>a.cfg.entry.localeCompare(b.cfg.entry)).map(x=>{const t=x.today_status||{};const lv=x.open?toR(x.open.eq_mark,x.lots):(t.pnl!=null?toR(t.pnl,x.lots):null);
 return`<tr><td class="num">${x.cfg.entry}</td><td><span class="sw" style="background:${C[x.i]}"></span><b>${x.id}</b> ${x.name}</td><td><span class="chip ${stc[t.state]||''}">${stTxt[t.state]||'-'}</span></td>
 <td class="sub" style="text-align:left">${why(t.note)}</td><td class="num ${sg(lv)}">${lv!=null?R1(lv):'–'}</td></tr>`}).join('')}</tbody></table></div>`)}</div>
 ${opens.length?opens.map(x=>liveCard(x)).join(''):`<div class="card sec"><div class="empty">Ippo endha trade-um open-la illa.<br>Adutha entries: 08:00 (S1 S3 S5 S7 S9) · 11:00 (S2 S4 S8) · 18:00 (S6) IST</div></div>`}`;
 for(const x of opens){let tk=[];try{tk=await (await fetch(`data/ticks/${x.open.id}.json?ts=${Date.now()}`)).json()}catch(e){}
  if(!tk.length||tab!=='live')continue;const lab=tk.map(t=>t.t.slice(11,16)),flat=v=>tk.map(()=>v),o=x.open;
  const d1=[{label:'BTC',data:tk.map(t=>t.spot),borderColor:C[0],borderWidth:2.5,pointRadius:0,tension:.2}];
  if(o.be_lo){d1.push({label:'Safe zone',data:flat(o.be_hi),borderColor:'rgba(34,197,94,.6)',backgroundColor:'rgba(34,197,94,.10)',fill:'+1',borderWidth:1,borderDash:[5,4],pointRadius:0});
   d1.push({label:'',data:flat(o.be_lo),borderColor:'rgba(34,197,94,.6)',borderWidth:1,borderDash:[5,4],pointRadius:0})}
  const pr=tk.map(t=>toR(t.pnl,x.lots)),up=pr[pr.length-1]>=0;
  const o1=base();o1.plugins.legend.labels.filter=i=>i.text!=='';o1.plugins.title={display:true,text:'BTC vilai vs safe zone',color:css('--ink2'),align:'start'};o1.scales.y.ticks.callback=v=>fx(v,0);
  mk('lv1_'+x.id,{type:'line',data:{labels:lab,datasets:d1},options:o1});
  const o3=base();o3.plugins.legend.display=false;o3.plugins.title={display:true,text:'Laabam / nashtam ₹',color:css('--ink2'),align:'start'};o3.scales.y.ticks.callback=v=>'₹'+(Math.abs(v)<10?v.toFixed(1):fx(v,0));
  mk('lv3_'+x.id,{type:'line',data:{labels:lab,datasets:[{data:pr,borderColor:up?'#22c55e':'#f43f5e',backgroundColor:up?'rgba(34,197,94,.15)':'rgba(244,63,94,.15)',fill:'origin',borderWidth:2.5,pointRadius:0,tension:.2}]},options:o3})}}
function liveCard(x){const o=x.open,m=toR(o.eq_mark,x.lots),liq=toR(o.eq_liq,x.lots),lo=o.be_lo,hi=o.be_hi,sp=S.spot,inside=sp>lo&&sp<hi;
 const pad=(hi-lo)*.3,a=Math.min(lo-pad,sp-pad*.3),b=Math.max(hi+pad,sp+pad*.3),pos=v=>Math.max(1,Math.min(99,(v-a)/(b-a)*100));
 const tgt=o.target?toR(o.target,x.lots):null,e=o.expiry;
 return`<div class="card sec"><div class="ch"><h3><span class="sw" style="background:${C[x.i]}"></span>${x.id} · ${x.name}</h3><span class="chip a">LIVE</span></div><div class="cb">
 <div class="big">${x.id} ippo <span class="${m>=0?'pos':'neg'}">${R1(m)} ${m>=0?'laabam':'nashtam'}</span>-la irukku</div>
 <div class="sub">ippove close pannaa ${R1(liq)} · ${x.lots} lot${x.lots>1?'s':''} · ₹20,000-la ${(m/S.capital*100).toFixed(2)}%</div>
 <div style="margin-top:16px;font-weight:700">BTC safe zone</div>
 <div class="zone"><div class="tr"></div><div class="ok" style="left:${pos(lo)}%;width:${pos(hi)-pos(lo)}%"></div><div class="lb" style="left:${pos(lo)}%">${fx(lo,0)}</div><div class="lb" style="left:${pos(hi)}%">${fx(hi,0)}</div>
 <div class="me" style="left:${pos(sp)}%"></div><div class="lb me2" style="left:${pos(sp)}%">BTC ${fx(sp,0)}</div></div>
 <div style="margin-top:22px">${inside?`<span class="pos">✔ Safe zone-kulla.</span> Keezh ellai-ku <b>${fx(sp-lo,0)}</b>, mel ellai-ku <b>${fx(hi-sp,0)}</b> points dooram.`:`<span class="neg">⚠ Safe zone-ah thaandiduchu</span> (${sp<=lo?'keezha':'mela'} ${fx(sp<=lo?lo-sp:sp-hi,0)} pts).`}</div>
 <div class="grid k4" style="margin:14px 0">${tgt!=null?`<div class="card kpi"><div class="l">Target</div><div class="v num pos">${R1(tgt)}</div><div class="s">idhu vandhaa exit</div></div>`:''}

 const d=L.qty<0?(cur>L.entry_px?'vilai eriduchu → nashtam':'vilai kuraindhudhu → laabam'):(cur>L.entry_px?'vilai eriduchu → laabam':'vilai kuraindhudhu → nashtam');
 return`<div class="leg"><span>${L.qty<0?'<span class="chip n">VITHOM</span>':'<span class="chip p">VAANGINOM</span>'} <b>${nm}</b> <span class="sub">${fx(L.entry_px)} → ${fx(cur)} · ${d}${L.status!=='open'?' · '+L.status:''}</span></span><b class="num ${sg(v)}">${rs(v,x.lots)}</b></div>`}).join('')}

function overview(){const el=$('v-overview');const T=STRS();
 const tot=T.reduce((a,x)=>a+toR(x.total,x.lots),0),n=T.reduce((a,x)=>a+x.n,0),w=T.reduce((a,x)=>a+(x.win||0)*x.n,0);
 const best=[...T].filter(x=>x.n).sort((a,b)=>toR(b.total,b.lots)-toR(a.total,a.lots))[0];
 const allTrades=T.flatMap(x=>x.trades.map(t=>({...t,x})));
 el.innerHTML=`<div class="grid k4">
 <div class="card kpi hero"><div class="l">Combined paper P&L</div><div class="v num ${sg(tot)}">${R1(tot)}</div><div class="s">${(tot/(S.capital*T.length)*100).toFixed(2)}% on ${T.length} × ₹${fx(S.capital,0)}</div></div>
 <div class="card kpi"><div class="l">Leader</div><div class="v">${best?best.id:'–'}</div><div class="s">${best?`${best.name.slice(0,30)} · ${rs(best.total,best.lots)}`:'first trades pending'}</div></div>
 <div class="card kpi"><div class="l">Closed trades</div><div class="v num">${n}</div><div class="s">win rate ${n?pc(w/n):'–'}</div></div>
 <div class="card kpi"><div class="l">Fees paid</div><div class="v num">${R1(T.reduce((a,x)=>a+toR(x.fees,x.lots),0))}</div><div class="s">incl. 18% GST</div></div></div>
 <div class="grid c21 sec">${card('Equity curve','₹ per account · realized + open',`<div class="filters" style="margin-bottom:8px">${[['rs','₹'],['pct','% return']].map(([k,l])=>`<button class="${eqMode===k?'on':''}" onclick="eqMode='${k}';draw()">${l}</button>`).join('')}</div><div class="chart"><canvas id="ov_eq"></canvas></div>`)}
 ${card('Return by strategy','% of ₹20,000',`<div class="chart"><canvas id="ov_ret"></canvas></div>`)}</div>
 <div class="grid c2 sec">${card('Daily P&L','₹ per day · stacked by strategy',`<div class="chart sm"><canvas id="ov_daily"></canvas></div>`)}
 ${card('Drawdown','₹ below each account\'s peak',`<div class="chart sm"><canvas id="ov_dd"></canvas></div>`)}</div>
 <div class="grid c3 sec">${card('Win / loss','all closed trades',`<div class="chart xs"><canvas id="ov_wl"></canvas></div>`)}
 ${card('Exit reasons','how trades ended',`<div class="chart xs"><canvas id="ov_ex"></canvas></div>`)}
 ${card('P&L per trade','₹ distribution',`<div class="chart xs"><canvas id="ov_hist"></canvas></div>`)}</div>
 <div class="sec">${card('Leaderboard',`ranked by ₹ · each = own ₹${fx(S.capital,0)} account`,`<div class="scroll"><table><thead><tr><th>#</th><th>Strategy</th><th>Lots</th><th>P&L ₹</th><th>Return</th><th>Balance</th><th>Trades</th><th>Win</th><th>Worst ₹</th><th>Max DD ₹</th><th>Live avg</th><th>Backtest avg</th></tr></thead><tbody>
 ${[...T].sort((a,b)=>toR(b.total,b.lots)-toR(a.total,a.lots)).map((x,r)=>`<tr><td class="mut">${r+1}</td><td><span class="sw" style="background:${C[x.i]}"></span><b>${x.id}</b> ${x.name}</td><td class="num">${x.lots}</td>
 <td class="num ${sg(x.total)}">${rs(x.total,x.lots)}</td><td class="num ${sg(x.total)}">${(toR(x.total,x.lots)/S.capital*100).toFixed(2)}%</td><td class="num">₹${fx(S.capital+toR(x.total,x.lots),0)}</td>
 <td class="num">${x.n}</td><td class="num">${pc(x.win)}</td><td class="num neg">${x.worst!=null?rs(x.worst,x.lots):'–'}</td><td class="num neg">${rs(x.dd,x.lots)}</td>
 <td class="num ${sg(x.avg)}">${sgn(x.avg)} pts</td><td class="num ${sg(x.bt.avg)}">${sgn(x.bt.avg)} pts</td></tr>`).join('')}</tbody></table></div>`)}</div>
 <div class="sec">${card('30-day heatmap','green = profit day, red = loss day',`<div class="scroll"><div class="heat" id="heat"></div></div>`)}</div>`;
 // equity
 const labs=[...new Set(T.flatMap(x=>x.equity.map(e=>e.t.slice(5,16))))].sort();
 const conv=(x,v)=>eqMode==='pct'?toR(v,x.lots)/S.capital*100:toR(v,x.lots);
 const oe=base();oe.scales.y.ticks.callback=v=>eqMode==='pct'?v.toFixed(1)+'%':'₹'+fx(v,0);
 mk('ov_eq',{type:'line',data:{labels:labs,datasets:T.map(x=>{const m=Object.fromEntries(x.equity.map(e=>[e.t.slice(5,16),conv(x,e.v)]));return{label:x.id,data:labs.map(l=>m[l]??null),spanGaps:true,borderColor:C[x.i],backgroundColor:C[x.i],borderWidth:2,pointRadius:0,tension:.2}})},options:oe});
 // return bar
 const rr=[...T].sort((a,b)=>toR(b.total,b.lots)-toR(a.total,a.lots));const orr=base({indexAxis:'y'});orr.plugins.legend.display=false;orr.scales.x.ticks.callback=v=>v+'%';orr.scales.x.grid={color:css('--line')};orr.scales.y.grid={display:false};
 mk('ov_ret',{type:'bar',data:{labels:rr.map(x=>x.id),datasets:[{data:rr.map(x=>toR(x.total,x.lots)/S.capital*100),backgroundColor:rr.map(x=>x.total>=0?'rgba(34,197,94,.75)':'rgba(244,63,94,.75)'),borderRadius:6}]},options:orr});
 // daily stacked
 const days=[...new Set(T.flatMap(x=>Object.keys(x.daily)))].sort();const od=base();od.scales.x.stacked=true;od.scales.y.stacked=true;od.scales.y.ticks.callback=v=>'₹'+fx(v,0);
 mk('ov_daily',{type:'bar',data:{labels:days.map(d=>d.slice(5)),datasets:T.map(x=>({label:x.id,data:days.map(d=>x.daily[d]!=null?toR(x.daily[d],x.lots):0),backgroundColor:C[x.i],borderRadius:3}))},options:od});
 // drawdown from closed trades
 const odd=base();odd.scales.y.ticks.callback=v=>'₹'+fx(v,0);
 mk('ov_dd',{type:'line',data:{labels:[0,...Array.from({length:Math.max(0,...T.map(x=>x.trades.length))},(_, i)=>i+1)],datasets:T.filter(x=>x.n).map(x=>{let c=0,p=0;const arr=[0,...x.trades.slice().reverse().map(t=>{c+=toR(t.pnl,x.lots);p=Math.max(p,c);return c-p})];return{label:x.id,data:arr,borderColor:C[x.i],backgroundColor:C[x.i]+'22',fill:true,borderWidth:1.6,pointRadius:0,stepped:true}})},options:odd});
 // win/loss donut
 const wins=allTrades.filter(t=>t.pnl>0).length,loss=allTrades.length-wins;
 mk('ov_wl',{type:'doughnut',data:{labels:['Win','Loss'],datasets:[{data:allTrades.length?[wins,loss]:[1,0],backgroundColor:allTrades.length?['#22c55e','#f43f5e']:['rgba(148,163,184,.25)','transparent'],borderWidth:0}]},options:{maintainAspectRatio:false,cutout:'70%',plugins:{legend:{position:'bottom',labels:{color:css('--ink2'),usePointStyle:true}}}}});
 // exit reasons
 const ex={};allTrades.forEach(t=>{const k=(t.exit_reason||'').replace('all_shorts_SL','both SL');ex[k]=(ex[k]||0)+1});const oex=base({indexAxis:'y'});oex.plugins.legend.display=false;oex.scales.y.grid={display:false};oex.scales.x.grid={color:css('--line')};
 mk('ov_ex',{type:'bar',data:{labels:Object.keys(ex),datasets:[{data:Object.values(ex),backgroundColor:'rgba(99,102,241,.75)',borderRadius:6}]},options:oex});
 // histogram
 const vals=allTrades.map(t=>toR(t.pnl,t.x.lots));const bins=[-1000,-500,-250,-100,-50,0,50,100,250,500,1e9],bl=['≤-500','-500..-250','-250..-100','-100..-50','-50..0','0..50','50..100','100..250','250..500','>500'];
 const cnt=bl.map((_,i)=>vals.filter(v=>v>(i?bins[i]:-1e9)&&v<=bins[i+1]).length);const oh=base();oh.plugins.legend.display=false;
 mk('ov_hist',{type:'bar',data:{labels:bl,datasets:[{data:cnt,backgroundColor:bl.map((_,i)=>i<5?'rgba(244,63,94,.7)':'rgba(34,197,94,.7)'),borderRadius:5}]},options:oh});
 // heatmap
 const st=new Date(S.start+'T12:00:00Z');const dd=[...Array(S.days)].map((_,i)=>{const d=new Date(st);d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10)});
 const mx=Math.max(1,...T.flatMap(x=>Object.values(x.daily).map(v=>Math.abs(toR(v,x.lots)))));
 $('heat').innerHTML='<div></div>'+dd.map((d,i)=>`<div class="h">${i+1}</div>`).join('')+T.map(x=>`<div><span class="sw" style="background:${C[x.i]}"></span>${x.id}</div>`+dd.map(d=>{const v=x.daily[d];if(v==null)return`<div class="c" title="${d}"></div>`;const r=toR(v,x.lots),a=.2+.8*Math.min(1,Math.abs(r)/mx);
 return`<div class="c" title="${d}: ${R1(r)}" style="background:${r>=0?`rgba(34,197,94,${a})`:`rgba(244,63,94,${a})`}"></div>`}).join('')).join('')}

 el.innerHTML=`<div class="grid c3">${T.map(x=>{const t=x.today_status||{},r=toR(x.total,x.lots);return`<div class="card"><div class="cb stc">
 <div class="top"><div><div style="font-weight:800"><span class="sw" style="background:${C[x.i]}"></span>${x.id}</div><div class="sub">${x.name}</div></div>
 <div style="text-align:right"><div class="num ${sg(r)}" style="font-size:20px;font-weight:800">${R1(r)}</div><div class="sub">${(r/S.capital*100).toFixed(2)}%</div></div></div>

 <div><div class="l">Worst</div><div class="v num neg">${x.worst!=null?rs(x.worst,x.lots):'–'}</div></div><div><div class="l">Max DD</div><div class="v num neg">${rs(x.dd,x.lots)}</div></div><div><div class="l">Today</div><div class="v"><span class="chip ${t.state==='OPEN'?'a':t.state==='DONE'?'p':t.state==='SKIPPED'?'n':''}">${t.state||'-'}</span></div></div></div>
 <div>${x.rules.map(q=>`<div class="sub" style="padding:2px 0">• ${q}</div>`).join('')}</div>

 T.forEach(x=>{let c=0;const d=[0,...x.trades.slice().reverse().map(t=>c+=toR(t.pnl,x.lots))];
  mk('sp_'+x.id,{type:'line',data:{labels:d.map((_,i)=>i),datasets:[{data:d,borderColor:C[x.i],backgroundColor:C[x.i]+'26',fill:true,borderWidth:2,pointRadius:0,tension:.25}]},
  options:{animation:false,responsive:true,maintainAspectRatio:false,events:[],plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}})})}

 el.innerHTML=`<div class="filters" style="margin-bottom:12px">${['ALL',...T.map(x=>x.id)].map(k=>`<button class="${k===tsel?'on':''}" onclick="tsel='${k}';draw()">${k}</button>`).join('')}</div>

 <td><span class="chip">${t.exit_reason}</span></td><td class="num">${rs(t.fees,t.x.lots)}</td><td class="num ${sg(t.pnl)}"><b>${rs(t.pnl,t.x.lots)}</b></td>
 <td>${t.chart?`<a href="charts/${t.chart}" target="_blank">view</a>`:'–'}</td></tr>`).join('')||'<tr><td colspan="10" class="empty">Innum closed trades illa</td></tr>'}</tbody></table></div>`)}
 <div class="sec">${card('Trade stories','every closed trade as a picture · tap to open',imgs.length?`<div class="gal">${imgs.map(t=>`<a href="charts/${t.chart}" target="_blank"><img loading="lazy" src="charts/${t.chart}" alt="${t.x.id} ${t.day}"><div class="cap"><span>${t.x.id} · ${t.day}</span><b class="${sg(t.pnl)}">${rs(t.pnl,t.x.lots)}</b></div></a>`).join('')}</div>`:'<div class="empty">Trade mudinjadhum images inga varum</div>')}</div>`}

function costs(){const el=$('v-costs');const T=STRS().filter(x=>x.spread_pct!=null);

 ${T.map(x=>`<tr><td><span class="sw" style="background:${C[x.i]}"></span><b>${x.id}</b> ${x.name}</td><td class="num">${pc(x.spread_pct)}</td><td class="num">${pc(x.slip_pct)}</td><td class="num">${fx(x.slip_pts,2)}</td><td class="num">${rs(x.fees,x.lots)}</td><td class="num mut">2% + $0.5</td></tr>`).join('')||'<tr><td colspan="6" class="empty">First entries-ku apram data varum</td></tr>'}</tbody></table></div>`)}</div>`;

 mk('co_sl',{type:'bar',data:{labels:T.map(x=>x.id),datasets:[{label:'Live',data:T.map(x=>x.slip_pct*100),backgroundColor:T.map(x=>C[x.i]),borderRadius:6},{label:'Backtest (2%)',data:T.map(()=>2),backgroundColor:'rgba(148,163,184,.35)',borderRadius:6}]},options:o2})}
/* ------------------------------------------------------------ RESEARCH */
function research(){const el=$('v-research');if(!R){el.innerHTML='<div class="card"><div class="empty">Loading…</div></div>';return}
 const k=(l,v,s)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
 const grp=(key,t)=>card(t,'share of configs profitable in test period',(R.lab_groups?.[key]||[]).sort((a,b)=>b.pos-a.pos).map(r=>`<div style="display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:7px 0"><span class="mono" style="font-size:12px">${r[key]}</span><div class="bar"><i style="width:${Math.max(r.pos*100,1.5)}%;background:${r.pos>0?'var(--pos)':'var(--neg)'}"></i></div><span class="num ${r.pos>0?'pos':'neg'}">${pc(r.pos)}</span></div>`).join(''));

 ${(R.grid||[]).map(r=>`<tr><td>${r.entry}</td><td>${(r.otm*100).toFixed(0)}%</td><td>${r.exit}</td><td>${r.target?pc(r.target):'–'}</td><td>${r.leg_sl?r.leg_sl+'×':'–'}</td><td>${r.mtm_sl?r.mtm_sl+'×':'–'}</td>
 <td class="num pos">${fx(r.IS_total,0)}</td><td class="num">${fx(r.IS_sh,2)}</td><td class="num pos">${fx(r.OOS_total,0)}</td><td class="num">${fx(r.OOS_sh,2)}</td><td class="num">${pc(r.OOS_win)}</td><td class="num neg">${fx(r.OOS_worst,0)}</td></tr>`).join('')}</tbody></table></div>`)}</div>

function draw(){if(!S)return;head();tabsBar();({live,overview,strategies,trades,costs,research,events})[tab]()}

load();setInterval(()=>{if(!['research','trades'].includes(tab))load()},30000);
